# Operação de uso único, autorizada pelo usuário em 28/10/2026.
# Gatilho de commit + branch + repositório + dupla variável, um mês.
name: ANAC-06 piloto unico real SBKP 2020-03
on:
  push:
    branches:
      - feature/anac-rima-staging-20261028
    paths:
      - .github/workflows/anac06-uma-execucao-202003.yml
permissions:
  contents: read
concurrency:
  group: arquivar-anac-rima
  cancel-in-progress: false
jobs:
  verificar-autorizacao:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/anac-rima-staging-20261028' && github.repository == 'brunogiacomelli1979-cyber/viracopos-cargo-intelligence' && github.event.head_commit.message == 'ANAC06_RUN_202003_20261028_USER_APPROVED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      aprovado: ${{ steps.gate.outputs.aprovado }}
    steps:
      - name: Conferir as duas autorizacoes ja configuradas pelo proprietario
        id: gate
        shell: bash
        env:
          GLOBAL: ${{ vars.ANAC_RIMA_COLETA_AUTORIZADA }}
          PILOTO: ${{ vars.ANAC_RIMA_PILOTO_202003_AUTORIZADO }}
        run: |
          if [[ "$GLOBAL" != "true" || "$PILOTO" != "true" ]]; then
            echo "aprovado=false" >> "$GITHUB_OUTPUT"
            echo "::error::Coleta nao autorizada: falta uma das duas repository variables."
            echo "## Coleta 2020-03 NÃO EXECUTADA: dupla autorização ausente" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "aprovado=true" >> "$GITHUB_OUTPUT"
          echo "## Dupla autorização conferida: somente 2020-03" >> "$GITHUB_STEP_SUMMARY"
  archive:
    needs: verificar-autorizacao
    if: ${{ needs.verificar-autorizacao.outputs.aprovado == 'true' && vars.ANAC_RIMA_COLETA_AUTORIZADA == 'true' && vars.ANAC_RIMA_PILOTO_202003_AUTORIZADO == 'true' && github.event.head_commit.message == 'ANAC06_RUN_202003_20261028_USER_APPROVED' && github.ref == 'refs/heads/feature/anac-rima-staging-20261028' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/anac-rima-staging-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir commit exato, competencia ainda ausente e branch remota
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feature/anac-rima-staging-20261028 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/anac/rima/manifesto.json').read_text())
          months = sorted(manifest['competencias'])
          if months != ['2020-01','2020-02','2024-01']:
              raise SystemExit('Recorte atual inesperado: recusar nova coleta')
          print('Baseline aprovado:', months)
          PY
      - name: Executar testes obrigatorios antes de coletar
        run: |
          python -m unittest discover -s tests -p 'test_arquivar_anac_rima.py' -v
          python -m unittest discover -s tests -p 'test_publicar_anac_git.py' -v
          python -m unittest discover -s tests -p 'test_anac06_end_to_end.py' -v
          python -m unittest discover -s tests -p 'test_verificar_publicacao_anac_rima.py' -v
          python -m unittest discover -s tests -p 'test_workflow_guard_anac.py' -v
          python scripts/auditar_anac_rima.py
          python scripts/validar_agrupamento_rima.py
      - name: Registrar SHAs remotos antes da coleta
        run: |
          echo "ANAC06_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ANAC06_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_ENV"
      - name: Baixar e arquivar SOMENTE ANAC 2020-03
        run: python scripts/arquivar_anac_rima.py --mode inicial --start 2020-03 --end 2020-03 --limit 1
      - name: Auditar semantica e somas antes do commit
        run: |
          python scripts/auditar_anac_rima.py
          python scripts/validar_agrupamento_rima.py
      - name: Publicar apenas manifesto e snapshot em homologacao
        run: python scripts/publicar_anac_git.py
      - name: Confirmar dados remotamente apos push
        run: |
          python scripts/verificar_publicacao_anac_rima.py --base "$ANAC06_BASE" --main-sha "$ANAC06_MAIN" --month 2020-03 --output reports/anac/qa-pos-push.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/anac/qa-pos-push.json')
          d=json.loads(p.read_text())
          assert d['status']=='novo_mes_confirmado'
          assert d['meses_novos']==['2020-03']
          assert d['main_preservada'] is True
          print('PILOTO REAL CONFIRMADO:',d['status'])
          PY
      - name: Guardar evidencia sem alterar dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anac06-202003-execucao-unica
          path: reports/anac/qa-pos-push.json
          retention-days: 30
          if-no-files-found: ignore
