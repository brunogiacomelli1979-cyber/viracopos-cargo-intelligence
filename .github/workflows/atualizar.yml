name: Atualizar indicadores mensais
on:
  push:
    branches: [main]
    paths:
      - 'scripts/coletar_*.py'
      - 'scripts/fontes_http.py'
      - 'scripts/atualizar.py'
      - 'requirements.txt'
      - '.github/workflows/atualizar.yml'
  schedule:
    # Configurável: dia 13, 10:17 UTC / 07:17 em Brasília.
    - cron: '17 10 13 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizar-indicadores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coletar e consolidar
        shell: bash
        run: |
          set -o pipefail
          python scripts/atualizar.py 2>&1 | tee coleta.log
      - run: python scripts/validar_dados.py
      - run: python scripts/auditar_metodologia.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/dashboard.test.cjs
      - name: Versionar somente depois da validação
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/brasil.csv data/viracopos.csv data/comex_viracopos.csv data/macro.csv data/fontes.json data/dashboard.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar snapshot mensal validado'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-coleta
          path: coleta.log
          retention-days: 30
  publish:
    needs: update
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ needs.update.outputs.revision }}
    permissions:
      contents: read
      pages: write
      id-token: write
