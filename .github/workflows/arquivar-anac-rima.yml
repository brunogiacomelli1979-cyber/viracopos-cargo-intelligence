name: Arquivar histórico ANAC RIMA SBKP
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inicial (backfill) ou mensal"
        type: choice
        options: [inicial, mensal]
        default: inicial
      start:
        description: "Primeira competência AAAA-MM"
        default: "2020-01"
      end:
        description: "Última competência (vazio = limite de seis meses)"
        default: ""
      limit:
        description: "Máximo de meses por execução (0 = sem limite)"
        default: "12"
  # Agendamento congelado até fechar o registro de pendências ANAC.
permissions:
  contents: read
concurrency:
  group: arquivar-anac-rima
  cancel-in-progress: false
jobs:
  archive:
    # Gate fechado: sem variável explícita de autorização, execução não coleta.
    if: ${{ github.ref_name == 'feature/anac-rima-staging-20261028' && vars.ANAC_RIMA_COLETA_AUTORIZADA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de integridade e publicação Git segura
        run: |
          python -m unittest discover -s tests -p 'test_arquivar_anac_rima.py' -v
          python -m unittest discover -s tests -p 'test_publicar_anac_git.py' -v
          python -m unittest discover -s tests -p 'test_auditar_anac_rima.py' -v
      - name: Baixar e arquivar SBKP
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'mensal' }}
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '2020-01' }}
          END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --start "$START" --limit "$LIMIT")
          if [[ -n "$END" ]]; then args+=(--end "$END"); fi
          python scripts/arquivar_anac_rima.py "${args[@]}"
      - name: Conferir integridade e agregações reais antes do commit
        if: success()
        run: |
          python scripts/auditar_anac_rima.py
          python scripts/validar_agrupamento_rima.py
      - name: Publicar apenas na branch homologada com proteção anti-conflito
        if: success()
        run: python scripts/publicar_anac_git.py
