name: Diagnosticar acesso ANAC RIMA (um mes)
on:
  push:
    branches:
      - feature/anac-rima-staging-20261028
    # Diagnostico de rede: nao repetir download oficial a cada ajuste no codigo.
    # Testes de unidade seguem no workflow geral de validacao de PRs.
    paths:
      - '.github/workflows/testar-acesso-anac-rima.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acesso:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar arquivador com dados sinteticos
        run: python -m unittest discover -s tests -p 'test_arquivar_anac_rima.py' -v
      - name: Conferir servidor e download oficial de 2024-01
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          from urllib.parse import urlsplit
          from scripts.arquivar_anac_rima import official_url
          url=official_url("2024-01")
          print("Host:",urlsplit(url).hostname)
          print("Path:",urlsplit(url).path)
          try:
              addresses=socket.getaddrinfo(urlsplit(url).hostname,443)
              print("DNS resolvido:",len(addresses),"enderecos")
          except OSError as err:
              print("DNS falhou:",repr(err))
              raise
          PY
          python - <<'PY'
          import csv,io,collections
          from datetime import datetime,timezone
          from pathlib import Path
          from scripts.arquivar_anac_rima import official_url,fetch_original,filter_sbkp,store_month,load_manifest
          month="2024-01"
          raw,url=fetch_original(official_url(month))
          print("Downloaded original bytes:",len(raw),flush=True)
          text=raw.decode("utf-8-sig",errors="replace")
          lines=text.splitlines()
          print("Header preamble:",lines[0][:100],flush=True)
          headers=next(csv.reader([lines[1]],delimiter=";"))
          print("Real header names:",repr(headers),flush=True)
          index={name:ix for ix,name in enumerate(headers)}
          airport_name=next((n for n in ["NR_AEROPORTO_REFERENCIA","NR_AEROPORTO"] if n in index),None)
          print("Actual airport field:",airport_name,flush=True)
          for name in ["QT_CARGA","QT_CORREIO","NR_MOVIMENTO_TIPO","NR_NATUREZA"]:
              print("Field found",name,name in index,flush=True)
          if airport_name:
              counts=collections.Counter()
              shown=0
              for row in csv.reader(io.StringIO("\n".join(lines[2:])),delimiter=";"):
                  if len(row)!=len(headers) or row[index[airport_name]].strip().upper()!="SBKP": continue
                  counts[(row[index["NR_MOVIMENTO_TIPO"]],row[index["NR_NATUREZA"]])]+=1
                  if shown<3:
                      sample={key:row[index[key]] for key in ["ANO","MES",airport_name,"NR_MOVIMENTO_TIPO","NR_NATUREZA","QT_CARGA","QT_CORREIO"] if key in index}
                      print("SBKP sample",sample,flush=True)
                      shown+=1
                  if sum(counts.values())>=1000: break
              print("SBKP codes within first 1000 matching rows:",counts,flush=True)
          compressed,metadata=filter_sbkp(raw,month)
          root=Path("data/anac/rima")
          manifest=load_manifest(root)
          print("Archived:",store_month(root,manifest,month,raw,url,datetime.now(timezone.utc).isoformat()),flush=True)
          PY
      - name: Verificar manifestos e arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path('data/anac/rima')
          manifest=json.loads((root/'manifesto.json').read_text(encoding='utf-8'))
          assert list(manifest['competencias'])==['2024-01']
          entry=manifest['competencias']['2024-01']
          file=root/'sbkp/2024/2024-01.csv.gz'
          data=file.read_bytes()
          assert hashlib.sha256(data).hexdigest()==entry['sha256_sbkp_gzip']
          rows=gzip.decompress(data).decode('utf-8').splitlines()
          assert len(rows)>1
          assert all('SBKP' in r for r in rows[1:])
          print('Dados verificados:',len(rows)-1,'linhas SBKP')
          print('SHA-256:',entry['sha256_sbkp_gzip'])
          PY
      - name: Guardar amostra para inspecao
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amostra-oficial-anac-rima-sbkp-2024-01
          path: data/anac/rima/
          retention-days: 7
      - name: Arquivar copia validada na branch de desenvolvimento
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/anac/rima/manifesto.json data/anac/rima/sbkp/
          if ! git diff --cached --quiet; then
            git commit -m 'data: preservar ANAC RIMA SBKP 2024-01 verificado'
            git push origin HEAD:feature/anac-rima-staging-20261028
          fi
